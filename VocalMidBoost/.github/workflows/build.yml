name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
            cmake_args: -A x64
          - os: macos-latest
            name: macOS-universal
            cmake_args: ""
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VocalMidBoost-VST3-${{ matrix.name }}
          path: build/VocalMidBoost_artefacts/Release/VST3/*

      - name: Upload AU
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: VocalMidBoost-AU-${{ matrix.name }}
          path: build/VocalMidBoost_artefacts/Release/AU/*
